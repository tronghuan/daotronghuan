<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1a0d"/>
      <stop offset="100%" stop-color="#0c0a05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#9a7200"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="40" height="40" rx="8" fill="url(#bg)"/>
  <rect x="1" y="1" width="38" height="38" rx="7"
        fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.8"/>
  <text
    x="20" y="26"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13"
    font-weight="bold"
    fill="url(#gold)"
    text-anchor="middle"
    letter-spacing="1.5"
    filter="url(#glow)"
  >DTH</text>
</svg>
